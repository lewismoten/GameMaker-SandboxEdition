; Pocket Player for two boards. Build: see README.md.
;   esp32-3248s035: the 3.5", 480x320, ST7796 board with GT911 touch (the first one)
;   cyd-2432s028:   the 2.8", 320x240 "Cheap Yellow Display" with XPT2046 touch (-DPOCKET_CYD28)
[env:esp32-3248s035]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@1.1.16
extra_scripts = pre:fwid.py
build_flags = -DCORE_DEBUG_LEVEL=0

[env:cyd-2432s028]
extends = env:esp32-3248s035
build_flags = ${env:esp32-3248s035.build_flags} -DPOCKET_CYD28
