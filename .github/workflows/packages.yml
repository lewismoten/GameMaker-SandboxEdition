# Build SDK workspaces and run quick API tests; isolated packed-consumer checks run locally.
name: Check npm packages

on:
  pull_request:
    branches: [master]
    paths:
      - 'web/packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-packages.mjs'
      - '.github/workflows/packages.yml'
  push:
    branches: [master]
    paths:
      - 'web/packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-packages.mjs'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:fast -- test/archives.test.ts test/toolsDrawing.test.ts test/formats.test.ts src/engine src/audio
        working-directory: web
