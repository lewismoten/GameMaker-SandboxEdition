# Build SDK workspaces and run quick API tests; isolated packed-consumer checks run locally.
name: Check npm packages

# Manual only: the same quick tests run locally before a push (npm run verify), so no Actions minutes on every change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GM_SKIP_GAME_BUILD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:fast -- test/archives.test.ts test/toolsDrawing.test.ts test/formats.test.ts src/engine src/audio
        working-directory: web
