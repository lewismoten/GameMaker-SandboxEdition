# Checks a few named games by hand (Actions → Check the games → Run workflow): npm run
# check:games --quick (web/), which plays each game's bot and walkthrough and checks its text,
# hidden items, levels, tin hearts and box hours. Every game takes far longer than CI should, so
# it doesn't run on pushes: run `npm run check:games` locally before committing a game (AGENTS.md).
# Like every check here it stops after 5 minutes; name one or two games at a time.
name: Check the games

on:
  workflow_dispatch:
    inputs:
      games:
        description: Game ids to check, separated by spaces (e.g. snowbound teddy)
        required: true
        default: snowbound

permissions:
  contents: read

concurrency:
  group: games-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check the named games
        env:
          GAMES: ${{ inputs.games }}
        run: npm run check:games -- --quick $(for g in $GAMES; do printf -- '--game %s ' "$g"; done)
