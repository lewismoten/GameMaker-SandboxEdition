name: Try a Linux download

# Builds one game's Linux download (<Title>.tar.gz) with web/scripts/linuxTar.ts and tries it on
# Ubuntu with WebKitGTK under a virtual display: it must open the game and keep a saved value
# between two launches, and without WebKitGTK play.sh must fall back to the browser. Run it by
# hand (Actions → Try a Linux download → Run workflow). Every game's download is built and
# attached to a release by downloads.yml, in one job.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      # only the one game this tries: no other disks, trinkets or laser nickels
      - run: npm ci --no-audit --no-fund
        env:
          GM_SKIP_GAME_BUILD: '1'
      - run: node ../scripts/build-games.mjs --game teddy
        env:
          GM_SKIP_FIELD_TRINKETS: '1'
          GM_SKIP_PIXEL_TRINKETS: '1'
          GM_SKIP_LASER_NICKELS: '1'
      - run: npx vite-node scripts/linuxTar.ts teddy --out ../dist/linux
      - name: Without WebKitGTK, play.sh opens the browser
        run: |
          mkdir -p "$RUNNER_TEMP/try" "$RUNNER_TEMP/bin"
          tar xzf ../dist/linux/*.tar.gz -C "$RUNNER_TEMP/try"
          printf '#!/bin/sh\necho "browser: $1"\n' > "$RUNNER_TEMP/bin/xdg-open"
          chmod +x "$RUNNER_TEMP/bin/xdg-open"
          if ldconfig -p | grep -q libwebkit2gtk-4; then echo 'WebKitGTK is already installed here: skipped'; exit 0; fi
          PATH="$RUNNER_TEMP/bin:$PATH" "$RUNNER_TEMP"/try/*/play.sh | tee "$RUNNER_TEMP/fallback.txt"
          grep -q 'browser: .*game.html' "$RUNNER_TEMP/fallback.txt"
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - name: Play it twice
        run: |
          export GM_READY_FILE="$RUNNER_TEMP/ready.json" GM_TEST_SAVE=1 GM_TEST_EXIT=1 GM_READY_DELAY=6
          for run in 1 2; do
            rm -f "$GM_READY_FILE"
            timeout 120 xvfb-run -a "$RUNNER_TEMP"/try/*/play.sh
            echo "Run $run: $(cat "$GM_READY_FILE")"
            grep -q '"title":"[^"]' "$GM_READY_FILE" || { echo "Run $run: the game page did not load"; exit 1; }
          done
          grep -q '"test":"[0-9]' "$GM_READY_FILE" || { echo 'The saved value did not survive a relaunch'; exit 1; }
          ls -R ~/.local/share/GameMaker | head -20
