name: Mac disk images

# Builds a .dmg (and .zip) Mac app of every listed game with web/scripts/macDmg.ts (plain
# JavaScript, so it runs on Linux) and attaches them to a GitHub release. Run it by hand
# (Actions → Mac disk images → Run workflow, naming a release tag) or by publishing a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the disk images to (created if missing)
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: web

jobs:
  dmg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite-node scripts/macDmg.ts --all --zip --out ../dist/mac
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Mac apps of the games (not notarized: see mac/README.md)."
          gh release upload "$TAG" ../dist/mac/*.dmg ../dist/mac/*.zip --clobber
