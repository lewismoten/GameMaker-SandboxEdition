# Publish development tools to GitHub Packages for a version tag on master.
name: Publish development tools to GitHub Packages

on:
  push:
    tags:
      - 'tools-v*'

permissions:
  contents: write # the GitHub Release
  packages: write

concurrency:
  group: publish-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GM_SKIP_GAME_BUILD: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Check tag and master
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo '::error::The tagged commit is not on master.'
            exit 1
          fi
          version=$(node -p "require('./packages/tools/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "tools-v$version" ]]; then
            echo "::error::Tag must be tools-v$version."
            exit 1
          fi
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Check source
        run: |
          npm run format:check
          npm run lint
          npx tsc --noEmit -p .
          npm run test:fast -- src/formats src/engine src/audio src/gfx src/project/zip.test.ts test/toolsDrawing.test.ts
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@lewismoten'
      - name: Publish package
        working-directory: web/packages/tools
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      # The Release body is this version's CHANGELOG section; the SBOM is npm's own (CycloneDX, runtime dependencies).
      - name: GitHub Release
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#tools-v}"
          node scripts/release/section.mjs web/packages/tools/CHANGELOG.md "$version" > "$RUNNER_TEMP/notes.md"
          sbom="$RUNNER_TEMP/tools-$version.sbom.cdx.json"
          npm sbom --sbom-format cyclonedx --package-lock-only --omit=dev -w @lewismoten/gamemaker-sandbox-tools > "$sbom"
          gh release create "$GITHUB_REF_NAME" --title "tools $version" --notes-file "$RUNNER_TEMP/notes.md" "$sbom"
        env:
          GH_TOKEN: ${{ github.token }}
