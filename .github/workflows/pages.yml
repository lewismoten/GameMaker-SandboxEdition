name: Deploy web app to GitHub Pages

# Builds and publishes only: format, lint, typecheck and tests run locally before a push (npm run verify).
# A pull request into master runs the same build (the whole deploy path but the upload and deploy steps), so its
# total Actions time is what a release costs; a pages-v* tag or a manual run deploys.
on:
  push:
    tags: ['pages-v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # the GitHub Release on a pages-v* tag
  pages: write
  id-token: write

concurrency:
  group: pages${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  # one job builds and deploys: every job is billed as at least a minute
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # a pull request has no environment (the github-pages one only accepts deploys), and a fork's token is read-only anyway;
    # the deploy name comes first because '' is falsy (`pr && '' || 'github-pages'` would always give github-pages)
    environment: ${{ github.event_name != 'pull_request' && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Summary header
        run: |
          {
            echo '| Stage | Seconds |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: npm ci
        run: |
          start=$SECONDS
          npm ci --omit=dev --no-audit --no-fund
          echo "| npm ci | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
        env:
          GM_SKIP_GAME_BUILD: '1'
      # the trinkets, laser nickels and Depth's frames made by a local build (scripts/release/seed.mjs; npm run
      # release:seed -- upload). Each keeps its source key, so the next step still remakes whatever changed since.
      - name: Fetch the build seed
        working-directory: .
        run: |
          start=$SECONDS
          node scripts/release/seed.mjs fetch
          echo "| build seed | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      # every game disk from its source, on every core; trinkets, nickels and frames only where the seed is out of date
      - name: Build games
        run: |
          start=$SECONDS
          node ../scripts/build-games.mjs --timing
          echo "| games (build-games) | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
      - name: Build site
        run: |
          start=$SECONDS
          npx vite build
          echo "| vite build | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
      # the artifact, the offline copy and each game ZIP within scripts/release/size-budgets.json, or no deploy
      - name: Size budgets
        run: |
          status=0
          node ../scripts/release/sizes.mjs --dist dist > "$RUNNER_TEMP/sizes.txt" || status=$?
          cat "$RUNNER_TEMP/sizes.txt"
          { echo; echo '```'; cat "$RUNNER_TEMP/sizes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v5
      # A tag also gets a GitHub Release: the CHANGELOG section as its body and npm's own SBOM (CycloneDX).
      - if: startsWith(github.ref, 'refs/tags/pages-v')
        name: GitHub Release
        working-directory: .
        run: |
          version="${GITHUB_REF_NAME#pages-v}"
          node scripts/release/section.mjs CHANGELOG.md "$version" > "$RUNNER_TEMP/notes.md"
          sbom="$RUNNER_TEMP/pages-$version.sbom.cdx.json"
          npm sbom --sbom-format cyclonedx --package-lock-only --omit=dev > "$sbom"
          gh release create "$GITHUB_REF_NAME" --title "Site $version" --notes-file "$RUNNER_TEMP/notes.md" "$sbom"
        env:
          GH_TOKEN: ${{ github.token }}
