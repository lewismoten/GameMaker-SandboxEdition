name: Deploy web app to GitHub Pages

# Builds and publishes only: format, lint, typecheck and tests run locally before a push (npm run verify).
on:
  push:
    tags: ['pages-v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  # one job builds and deploys: every job is billed as at least a minute
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          GM_SKIP_GAME_BUILD: '1'
      # every game from its source, on every core (Depth's animation frames included)
      - run: node ../scripts/build-games.mjs --timing
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
