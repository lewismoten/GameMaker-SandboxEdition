name: Deploy web app to GitHub Pages

on:
  push:
    tags: ['pages-v*']
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  # one job for the whole check: every job is billed as at least a minute, so no matrix here
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # the last run's built games and Depth's frames; build-games.mjs then rebuilds only the games whose own inputs changed
      - uses: actions/cache/restore@v6
        with:
          path: |
            games/*/disk
            games/*/walkPaths.json
            games/.build-cache.json
            games/.render-cache
          key: games-${{ github.sha }}
          restore-keys: games-
      - run: npm ci
        env:
          GM_SKIP_GAME_BUILD: '1'
      # capped so a cold cache still leaves time to save what was built; build-games.mjs records each game as it lands
      - id: games
        run: node ../scripts/build-games.mjs
        timeout-minutes: 3
        continue-on-error: true
      # keep only this source's Depth frames, so the cache doesn't grow with every change
      - run: node ../scripts/prune-render-cache.mjs
        if: always()
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            games/*/disk
            games/*/walkPaths.json
            games/.build-cache.json
            games/.render-cache
          key: games-${{ github.sha }}
      # a cold cache: the games saved so far are kept, and the next run builds the rest
      - if: steps.games.outcome != 'success'
        run: echo "::error::Not every game was built in time; the next run continues from the cache." && exit 1
      - run: npm run format:check
      - run: npm run lint
      # only the quick tests (each under 50 ms here); the slow ones run locally (test/slowTests.json)
      - run: npm run test:fast
      # type-checks, then builds
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pages-v')
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pages-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
