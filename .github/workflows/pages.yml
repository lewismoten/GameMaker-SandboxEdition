name: Deploy web app to GitHub Pages

on:
  push:
    tags: ['pages-v*']
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # only the quick tests (each under 50 ms here); the slow ones run locally (test/slowTests.json)
      - run: npm run test:fast
      # type-checks, then builds
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pages-v')
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pages-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
