name: Try a Windows program

# Builds one game's Windows program (.exe) with web/scripts/winExe.ts and tries it on a real
# Windows machine: it must open the game in WebView2 and keep a saved value between two
# launches. Run it by hand (Actions → Try a Windows program → Run workflow). Every game's
# program is built and attached to a release by downloads.yml, in one Linux job.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      # only the one game this tries: no other disks, trinkets or laser nickels
      - run: npm ci --no-audit --no-fund
        env:
          GM_SKIP_GAME_BUILD: '1'
      - run: node ../scripts/build-games.mjs --game teddy
        env:
          GM_SKIP_FIELD_TRINKETS: '1'
          GM_SKIP_PIXEL_TRINKETS: '1'
          GM_SKIP_LASER_NICKELS: '1'
      - run: npx vite-node scripts/winExe.ts teddy --out ../dist/win
      - name: Play it twice
        shell: pwsh
        run: |
          $exe = (Get-ChildItem ../dist/win/*.exe | Select-Object -First 1).FullName
          $env:GM_READY_FILE = "$env:RUNNER_TEMP\ready.json"
          $env:GM_TEST_SAVE = '1'
          $env:GM_TEST_EXIT = '1'
          foreach ($run in 1, 2) {
            Remove-Item $env:GM_READY_FILE -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -PassThru
            if (-not $p.WaitForExit(90000)) { Stop-Process $p; throw "Run $run did not finish" }
            $ready = Get-Content $env:GM_READY_FILE -Raw
            Write-Output "Run ${run}: $ready"
            $r = $ready | ConvertFrom-Json
            if ($r.origin -ne 'https://game.gamemaker.example') { throw "Run ${run}: the game page did not load" }
            if ($run -eq 2 -and -not $r.test) { throw 'The saved value did not survive a relaunch' }
          }
          Get-ChildItem "$env:LOCALAPPDATA\GameMaker"
