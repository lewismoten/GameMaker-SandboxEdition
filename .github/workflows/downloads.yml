name: Native downloads

# One job builds every game's Mac (.dmg and .zip), Windows (.exe and .zip) and Linux (.tar.gz)
# download with web/scripts/macDmg.ts, winExe.ts and linuxTar.ts (plain JavaScript, so all three
# run on Linux), checks their sizes (scripts/release/size-budgets.json) and attaches them to a
# GitHub release. Run it by hand (Actions → Native downloads → Run workflow, naming a release
# tag; with no tag it only builds). One job, because every job bills at least a minute: the
# three separate workflows it replaces each rendered the game frames in eight more jobs.
# Trying a download on a real Windows or Linux machine is win-exe.yml and linux-tar.yml (by hand).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the downloads to (created if missing); empty to only build
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: web

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          GM_SKIP_GAME_BUILD: '1'
      # Depth's rendered frames from the build seed (scripts/release/seed.mjs); remade only if out of date
      - name: Fetch the build seed
        working-directory: .
        run: node scripts/release/seed.mjs fetch
        env:
          GH_TOKEN: ${{ github.token }}
      # the downloads need the game disks only: no plastic trinkets or laser nickels (the site's files)
      - name: Build games on every core
        run: node ../scripts/build-games.mjs --timing
        env:
          GM_SKIP_FIELD_TRINKETS: '1'
          GM_SKIP_PIXEL_TRINKETS: '1'
          GM_SKIP_LASER_NICKELS: '1'
      - name: Build the downloads
        run: |
          npx vite-node scripts/macDmg.ts --all --zip --out ../dist/mac & mac=$!
          npx vite-node scripts/winExe.ts --all --zip --out ../dist/win & win=$!
          npx vite-node scripts/linuxTar.ts --all --out ../dist/linux & linux=$!
          wait "$mac" && wait "$win" && wait "$linux"
      - name: Size budgets
        run: node ../scripts/release/sizes.mjs --downloads ../dist
      - name: Attach to the release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Mac, Windows and Linux downloads of the games (not signed: see mac/README.md and win/README.md)."
          gh release upload "$TAG" ../dist/mac/*.dmg ../dist/mac/*.zip ../dist/win/*.exe ../dist/win/*.zip ../dist/linux/*.tar.gz --clobber
