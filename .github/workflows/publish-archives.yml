# Publish game archives to GitHub Packages for a version tag on master.
name: Publish game archives to GitHub Packages

on:
  push:
    tags:
      - 'archives-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-archives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tag and master
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo '::error::The tagged commit is not on master.'
            exit 1
          fi
          version=$(node -p "require('./packages/archives/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "archives-v$version" ]]; then
            echo "::error::Tag must be archives-v$version."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: |
          npm run format:check
          npm run lint
          npx tsc --noEmit -p .
          npx vitest run test/archives.test.ts test/zip.test.ts src/project/importScan.test.ts src/project/importPlayer.test.ts
      - name: Verify packed package
        working-directory: web/packages/archives
        run: npm run verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@lewismoten'
      - name: Publish package
        working-directory: web/packages/archives
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
