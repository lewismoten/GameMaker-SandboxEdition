<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000080" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Game-Maker: Sandbox Edition — make retro DOS games in your browser</title>
    <script>
      // Before the first paint: the readable text in #app is for crawlers and browsers
      // without JavaScript, so keep it out of sight while the app starts, on the
      // background of the interface about to open (the same choice main.ts makes).
      (function (d, h) {
        var ui = 'desk';
        try {
          ui = /^#\/(p\/|game\/|help$|$)/.test(h) || (h !== '#/desk' && localStorage.getItem('gm-ui') === 'modern') ? 'modern' : 'desk';
        } catch (e) {}
        d.className += ' js';
        d.setAttribute('data-ui', ui);
      })(document.documentElement, location.hash);
    </script>
    <style>
      html.js .seo-static { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      html.js body { margin: 0; }
      html[data-ui='desk'] body { background: #465063; }
      html[data-ui='modern'] body { background: #e9ecf3; }
    </style>
    <!--SEO:HEAD-->
  </head>
  <body>
    <div id="app">
      <!--SEO:BODY-->
    </div>
    <script type="module" src="/src/seo/route.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
